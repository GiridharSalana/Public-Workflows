name: Youtube-Pilot

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Pipeline stage to run'
        required: true
        default: 'discover'
        type: choice
        options:
          - discover
          - draft
          - render
          - upload
          - monitor
          - run
      video_id:
        description: 'Video id (for draft/render/upload). Leave blank for discover/run.'
        required: false
        type: string
      dry_run:
        description: 'Dry-run (no real upload). Recommended until pipeline is trusted.'
        required: false
        default: true
        type: boolean
  repository_dispatch:
    types: [youtube-pilot]

permissions:
  contents: write
  actions: write   # needed to trigger Save-Bot

jobs:
  youtube-pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Public-Workflows
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Fetch keys from Save-Bot (single source of truth) -----------------
      # Save-Bot bundles every secret/var into a .giri-env artifact. We trigger
      # a fresh run, wait for it, then download and source the artifact so this
      # workflow doesn't need to enumerate secrets individually.
      - name: Trigger Save-Bot to refresh .giri-env
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow run save-bot.yml --repo GiridharSalana/Public-Workflows
          echo "Waiting for Save-Bot run to start..."
          sleep 10
          # Wait for the most recent Save-Bot run to complete
          for i in $(seq 1 30); do
            STATUS=$(gh run list --workflow=save-bot.yml --repo GiridharSalana/Public-Workflows --limit 1 --json status,conclusion -q '.[0].status')
            CONC=$(gh run list --workflow=save-bot.yml --repo GiridharSalana/Public-Workflows --limit 1 --json status,conclusion -q '.[0].conclusion')
            echo "Save-Bot status=$STATUS conclusion=$CONC (poll $i)"
            if [ "$STATUS" = "completed" ]; then
              [ "$CONC" = "success" ] && break
              echo "Save-Bot did not succeed: $CONC"
              exit 1
            fi
            sleep 5
          done

      - name: Download .giri-env artifact from Save-Bot
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: save-bot.yml
          name: giri-env
          path: .
          github_token: ${{ secrets.GH_PAT }}
          search_artifacts: true
          workflow_conclusion: success

      - name: Load .giri-env into job environment
        run: |
          # Mask every value, then export each KEY=VAL into $GITHUB_ENV.
          # The mask call ensures secrets stay redacted in subsequent step logs.
          while IFS='=' read -r KEY VAL; do
            case "$KEY" in
              ''|\#*) continue ;;
            esac
            echo "::add-mask::$VAL"
            echo "$KEY=$VAL" >> "$GITHUB_ENV"
          done < .giri-env
          rm -f .giri-env
          echo "Loaded keys from Save-Bot artifact."

      # --- Decrypt the youtube-pilot repo ------------------------------------
      - name: Install age
        run: |
          cd /tmp
          curl -LO https://github.com/FiloSottile/age/releases/download/v1.1.1/age-v1.1.1-linux-amd64.tar.gz
          tar -xzf age-v1.1.1-linux-amd64.tar.gz
          sudo mv age/age /usr/local/bin/
          sudo mv age/age-keygen /usr/local/bin/

      - name: Decrypt youtube-pilot
        run: |
          echo "$AGE_SECRET_KEY" > /tmp/age-key.txt
          age -d -i /tmp/age-key.txt -o youtube-pilot.tar.gz work_files/youtube-pilot.age
          mkdir -p workspace
          tar -xzf youtube-pilot.tar.gz -C workspace
          rm youtube-pilot.tar.gz /tmp/age-key.txt

      # --- Toolchain ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv and ffmpeg
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # --- Notify + run ------------------------------------------------------
      - name: Notify start
        run: |
          MSG="🛫 youtube-pilot: stage=\`${{ github.event.inputs.stage || 'run' }}\` started"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="$MSG" \
            -d parse_mode="Markdown" || true

      - name: Run youtube-pilot
        working-directory: workspace
        env:
          PYTHONUNBUFFERED: 1
        run: |
          uv sync
          STAGE="${{ github.event.inputs.stage || 'run' }}"
          VIDEO_ID="${{ github.event.inputs.video_id }}"
          DRY="${{ github.event.inputs.dry_run }}"

          ARGS=""
          [ "$DRY" = "true" ] && ARGS="--dry-run"

          if [ "$STAGE" = "run" ]; then
            uv run youtube-pilot run $ARGS
          elif [ -n "$VIDEO_ID" ]; then
            uv run youtube-pilot "$STAGE" "$VIDEO_ID"
          else
            uv run youtube-pilot "$STAGE"
          fi

      # --- Re-encrypt state and commit back ----------------------------------
      - name: Re-encrypt and commit state
        if: always()
        run: |
          cd workspace
          tar --exclude='.git' --exclude='.venv' --exclude='__pycache__' \
              --exclude='assets/cache' --exclude='output' \
              -czf ../youtube-pilot.tar.gz .
          cd ..
          age -r "$AGE_PUBLIC_KEY" -o work_files/youtube-pilot.age youtube-pilot.tar.gz
          rm youtube-pilot.tar.gz

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add work_files/youtube-pilot.age
          git commit -m "Update encrypted youtube-pilot state" || echo "No changes"
          for i in $(seq 1 10); do
            git pull --rebase origin main || true
            if git push; then
              echo "Push succeeded on attempt $i"
              break
            fi
            sleep 5
          done

      - name: Notify completion
        if: always()
        run: |
          STATUS="${{ job.status }}"
          ICON="✅"
          [ "$STATUS" != "success" ] && ICON="❌"
          MSG="$ICON youtube-pilot: stage=\`${{ github.event.inputs.stage || 'run' }}\` finished ($STATUS)"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="$MSG" \
            -d parse_mode="Markdown" || true
